# Add these lines to your Hyprland config, or source this file:
#   source = ~/.config/quickshell/island/hypr/island-binds.conf

# Start the island shell when Hyprland starts.
exec-once = qs -c island

# Dynamic Island keybindings (IPC fallback for GlobalShortcut)
bind = ALT, D, exec, qs -c island ipc call island launcher
bind = ALT, C, exec, qs -c island ipc call island clipboard
bind = ALT, comma, exec, qs -c island ipc call island settings
bind = ALT, T, exec, qs -c island ipc call island wallpaper
bind = CTRL ALT, DELETE, exec, qs -c island ipc call island power
